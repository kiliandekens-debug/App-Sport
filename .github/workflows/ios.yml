# Builds the iPhone app on a macOS runner.
# - Always: compiles the iPhone app and its Apple Watch app for the simulator (no Apple
#   account needed) to catch build errors.
# - When the App Store Connect secrets exist: archives, signs automatically and uploads
#   the build to TestFlight. Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (content of
#   the .p8 file), APPLE_TEAM_ID.
name: iOS

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'ios/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://mrqxkncxksncidkpwlib.supabase.co
  # Publishable key: public by design (row level security protects the data).
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_YrgfmzKAzCWRk8MGR27kDQ_Oh1eeI59

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    # contents: write only to publish the watch screenshots on the watch-shots branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # App Store Connect only accepts builds made with Xcode 26 (iOS 26 SDK) or later.
      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -E 'Xcode_[0-9.]+\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|watchos|watchsimulator" || true

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Build the Apple Watch app for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -target KadeonWatch -configuration Debug \
            -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/watch.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/watch.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/watch.log"; exit 1; }
          echo "Apple Watch app OK"

      - name: Build for the simulator (iPhone app with the watch app inside)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/app.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/app.log" | sort -u | head -60; tail -n 30 "$RUNNER_TEMP/app.log"; exit 1; }
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 8 -path '*Debug-iphonesimulator/App.app/Watch/KadeonWatch.app' | grep -q . \
            || { echo "KadeonWatch.app is not embedded in App.app"; exit 1; }
          echo "iPhone app with the watch app inside OK"

      # Screenshots of every watch screen with fake data (launch argument -demo, Debug builds
      # only), pushed to the watch-shots branch. Never blocks the build.
      - name: Watch screenshots (simulator)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP=$(find ios/App/build "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Debug-watchsimulator/KadeonWatch.app' 2>/dev/null | head -1)
          echo "App: $APP"
          [ -n "$APP" ]
          # Two watches: the biggest and the smallest available (does it fit on both?).
          read BIG SMALL <<< "$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          c = [x for k, v in d.items() if "watchOS" in k for x in v if "Apple Watch" in x["name"]]
          # Ultra first among the big ones (49 mm, the watch Kilian wears).
          mm = lambda x: 99 if "Ultra" in x["name"] else int((re.search(r"(\d\d)mm", x["name"]) or [0, 44])[1])
          c.sort(key=mm)
          print(c[-1]["udid"], c[0]["udid"]) if c else print("", "")
          ')"
          echo "Montres : $BIG / $SMALL"
          [ -n "$BIG" ]
          OUT="$RUNNER_TEMP/shots"
          mkdir -p "$OUT"
          shoot() {
            local UDID=$1 SUFFIX=$2; shift 2
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl install "$UDID" "$APP"
            local FIRST=1
            for s in "$@"; do
              xcrun simctl terminate "$UDID" be.kadeon.sport.watchkitapp 2>/dev/null || true
              xcrun simctl launch "$UDID" be.kadeon.sport.watchkitapp -demo "$s" > /dev/null
              if [ "$FIRST" = 1 ]; then sleep 12; FIRST=0; else sleep 5; fi
              xcrun simctl io "$UDID" screenshot "$OUT/$s$SUFFIX.png" > /dev/null 2>&1
              echo "shot $s$SUFFIX"
            done
            xcrun simctl shutdown "$UDID" || true
          }
          shoot "$BIG" "" home run-start free-start countdown warmup-run run-in run-slow run-fast recovery block done free paused run-summary tapis warmup set rest next summary
          if [ -n "$SMALL" ] && [ "$SMALL" != "$BIG" ]; then
            shoot "$SMALL" "-petite" home run-start run-in recovery block done free tapis set rest
          fi
          # Branch on top of this commit (an orphan branch is refused), Vercel off for it.
          git fetch -q --depth 1 origin "$GITHUB_SHA" || true
          git checkout -q -B watch-shots
          rm -rf watch-shots && mkdir watch-shots && cp "$OUT"/*.png watch-shots/
          node -e "const f='vercel.json',j=require('./'+f);j.git={deploymentEnabled:false};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          git add -f watch-shots vercel.json
          git -c user.name="Kadeon CI" -c user.email="ci@kadeon.be" commit -qm "Captures montre ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
          git push -fq origin HEAD:refs/heads/watch-shots
          echo "Captures sur la branche watch-shots"

      - name: Keep the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: watch-shots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Check App Store Connect secrets
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: echo "ready=$([ -n "$ASC_KEY_ID" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # The team has no registered device, so Xcode's automatic signing cannot archive.
      # Each run makes a short-lived distribution certificate and App Store profiles with
      # the API key (scripts/asc_signing.py), signs manually, then deletes them.
      # Apps: iPhone, Apple Watch, and the widget extension (Live Activity).
      - name: Signing certificate and profiles (temporary)
        if: steps.asc.outputs.ready == 'yes' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WORK: ${{ runner.temp }}/signing
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]"
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py setup
          cd "$WORK"
          openssl x509 -inform DER -in dist.cer -out dist.pem
          PASS=$(openssl rand -hex 16)
          openssl pkcs12 -export -legacy -inkey dist.key -in dist.pem -out dist.p12 -passout "pass:$PASS" 2>/dev/null \
            || openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout "pass:$PASS"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$PASS" "$KC"
          security import dist.p12 -k "$KC" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

      - name: Archive and upload to TestFlight
        if: steps.asc.outputs.ready == 'yes' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          VERSION=$(node -p "require('./package.json').version")
          APP_PROFILE="Kadeon CI app ${{ github.run_id }}"
          WATCH_PROFILE="Kadeon CI watch ${{ github.run_id }}"
          WIDGETS_PROFILE="Kadeon CI widgets ${{ github.run_id }}"
          # One profile per target: written into this checkout's project only.
          python3 - "$APP_PROFILE" "$WATCH_PROFILE" "$WIDGETS_PROFILE" <<'PY'
          import sys
          p = "ios/App/App.xcodeproj/project.pbxproj"
          s = open(p).read()
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport;", f'PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{sys.argv[1]}";')
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport.watchkitapp;", f'PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport.watchkitapp;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{sys.argv[2]}";')
          s = s.replace("PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport.widgets;", f'PRODUCT_BUNDLE_IDENTIFIER = be.kadeon.sport.widgets;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{sys.argv[3]}";')
          s = s.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          s = s.replace("ProvisioningStyle = Automatic;", "ProvisioningStyle = Manual;")
          open(p, "w").write(s)
          PY
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -40; tail -n 40 "$RUNNER_TEMP/archive.log"; exit 1; }
          echo "Archive OK"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>be.kadeon.sport</key><string>$APP_PROFILE</string>
              <key>be.kadeon.sport.watchkitapp</key><string>$WATCH_PROFILE</string>
              <key>be.kadeon.sport.widgets</key><string>$WIDGETS_PROFILE</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -40; tail -n 40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/export.log"
          echo "Envoyé sur TestFlight : version $VERSION (build ${{ github.run_number }})"

      - name: Remove the temporary certificate and profiles
        if: always() && steps.asc.outputs.ready == 'yes' && github.ref == 'refs/heads/main'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          WORK: ${{ runner.temp }}/signing
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          [ -x "$RUNNER_TEMP/venv/bin/python" ] && "$RUNNER_TEMP/venv/bin/python" scripts/asc_signing.py cleanup || true
